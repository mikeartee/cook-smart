name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cooksmartdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Run TypeScript check
      run: npm run type-check
    
    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cooksmartdb_test
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cooksmartdb_test
    
    - name: Generate test coverage
      run: npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level high
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build backend
      run: |
        cd backend
        npm ci
        npm run build
    
    - name: Build mobile app (Android)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: Check code formatting
      run: npm run format:check
    
    - name: Validate commit messages
      run: npx commitlint --from HEAD~1 --to HEAD --verbose

  flutter-mobile:
    name: Flutter Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Detect mobile/ changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          mobile:
            - 'mobile/**'
    
    - name: Setup Flutter
      if: steps.changes.outputs.mobile == 'true'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'
        cache: true
    
    - name: Install Flutter dependencies
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: flutter pub get
    
    - name: Run flutter analyze
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: flutter analyze
    
    - name: Run flutter test
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: flutter test
    
    - name: Check architecture invariants
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: dart run tool/check_architecture.dart
    
    - name: Check folder and naming structure
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: dart run tool/check_structure.dart
    
    - name: Check cross-platform package support
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: dart run tool/check_packages.dart
    
    - name: Scan for hardcoded secrets
      if: steps.changes.outputs.mobile == 'true'
      working-directory: mobile
      run: dart run tool/check_secrets.dart