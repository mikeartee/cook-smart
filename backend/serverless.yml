service: cook-smart-api

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN}
    NODE_ENV: ${env:NODE_ENV}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - rds:*
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:*
          Resource: "*"

functions:
  register:
    handler: functions/auth/register.handler
    events:
      - http:
          path: auth/register
          method: post
          cors: true
  
  login:
    handler: functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true
  
  me:
    handler: functions/auth/me.handler
    events:
      - http:
          path: auth/me
          method: get
          cors: true
  
  getProfile:
    handler: functions/users/getProfile.handler
    events:
      - http:
          path: users/profile
          method: get
          cors: true
  
  updateProfile:
    handler: functions/users/updateProfile.handler
    events:
      - http:
          path: users/profile
          method: put
          cors: true
  
  changePassword:
    handler: functions/users/changePassword.handler
    events:
      - http:
          path: users/password
          method: put
          cors: true
  
  exportData:
    handler: functions/users/exportData.handler
    events:
      - http:
          path: users/export
          method: get
          cors: true
  
  deleteAccount:
    handler: functions/users/deleteAccount.handler
    events:
      - http:
          path: users/account
          method: delete
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
