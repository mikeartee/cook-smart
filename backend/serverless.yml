service: cook-smart-api

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN}
    NODE_ENV: ${env:NODE_ENV}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - rds:*
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:*
          Resource: "*"

functions:
  register:
    handler: functions/auth/register.handler
    events:
      - http:
          path: auth/register
          method: post
          cors: true
  
  login:
    handler: functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true
  
  me:
    handler: functions/auth/me.handler
    events:
      - http:
          path: auth/me
          method: get
          cors: true
  # User functions will be added in Task 4.2-4.4
  # GDPR functions will be added in Task 5.1-5.2

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
